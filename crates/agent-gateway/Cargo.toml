[package]
name = "agent-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "本地网关：127.0.0.1 HTTP+WS、token 鉴权、域:动作 RPC 路由、事件订阅推送"

[dependencies]
agent-acp = { path = "../agent-acp" }
agent-core = { path = "../agent-core" }
axum = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
# 与 agent-sandbox 同源同版（lock 已有 windows-sys 0.61.2）：握手文件 ACL 三件套
# GetNamedSecurityInfoW/SetEntriesInAclW/SetNamedSecurityInfoW（Authorization）
# + 掩码/描述符常量（Security、Storage_FileSystem）+ 错误码与 LocalFree（Foundation）。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = { workspace = true }

# Client/server wire compatibility tests; shell does not depend on the server.
lengsuo-shell = { path = "../lengsuo-shell" }
